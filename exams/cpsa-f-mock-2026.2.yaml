  type: P
  points: 1
  pick: 3
  text:
    de: Es gibt zahlreiche Ansätze, die zu einer Softwarearchitektur führen. Welche der folgenden Ansätze kommen in der Praxis am häufigsten vor?
    en: There are many approaches that lead to a software architecture. Which of the following are the most often found in practice?
  options:
  - de: User-Interface Driven Design
