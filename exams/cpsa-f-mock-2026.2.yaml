  type: P
  points: 1
  pick: 3
  text:
    de: Diverse Architekturentwicklungsmethoden schlagen einen sichtenbasierten Ansatz vor. Welche der folgenden Sichten werden am häufigsten verwendet?
    en: Several architecture development methods suggest a view-based approach. Which of the following views are most often used?
  options:
  - de: Physische Datenbanksicht
    en: Physical database view
  - de: Kontextsicht
    en: Context view
    correct: true
  - de: Bausteinsicht oder Komponentensicht
