questions:
- id: Q-20-04-01
  type: A
  points: 1
  text:
    de: Wie viele Definitionen des Begriffes „Softwarearchitektur“ gibt es?
    en: How many definitions of “software architecture” exist?
  options:
  - de: Genau eine für alle Arten von Systemen.
    en: Exactly one for all kinds of systems.
  - de: Eine für jede Art von Softwaresystem (z. B. „eingebettet“, „Echtzeit“, „Entscheidungsunterstützung“, „Web“, „Batch“, ...).
    en: One for every kind of software system (e.g. “embedded”, “real-time”, “decision support”, “web”, “batch”, ...).
  - de: Ein Dutzend oder mehr unterschiedliche Definitionen.
    en: A dozen or more different definitions.
    correct: true
- id: Q-20-04-02
  type: P
  points: 1
  pick: 3
  text:
    de: Welche der folgenden Aspekte werden durch den Begriff „Softwarearchitektur“ abgedeckt?
    en: Which of the following aspects are covered by the term “software architecture”?
  options:
  - de: Komponenten
    en: Components
    correct: true
  - de: Querschnittskonzepte
    en: Cross-cutting concepts
    correct: true
  - de: (interne und externe) Schnittstellen
    en: (internal and external) Interfaces
    correct: true
  - de: Programmierkonventionen („coding conventions“)
    en: Coding conventions
  - de: Hardware-Sizing
    en: Hardware sizing
- id: Q-17-13-01
  type: P
  points: 2
  pick: 4
  text:
    de: Welche VIER der folgenden Aussagen zu (Querschnitts-) Konzepten sind am zutreffendsten?
    en: Which FOUR of the following statements about (crosscutting) concepts are most appropriate?
  options:
  - de: Durch die einheitliche Verwendung von Konzepten wird die Kopplung zwischen Bausteinen verringert.
    en: Uniform usage of concepts reduces coupling between building blocks.
  - de: Durch die Definition von geeigneten Konzepten wird die Mustertreue der Architektur sichergestellt.
    en: The definition of appropriate concepts ensures the pattern compliance of the architecture.
  - de: Eine einheitliche Ausnahmebehandlung (Exception Handling) kann man gut erreichen, indem die Architekt:innen mit den Entwickler:innen vor der Implementierung ein geeignetes Konzept vereinbaren.
    en: Uniform exception handling can be achieved when architects agree with developers upon a suitable concept prior to implementation.
    correct: true
  - de: Für jedes Qualitätsziel sollte es ein explizit dokumentiertes Konzept geben.
    en: For each quality goal there should be an explicitly documented concept.
  - de: Konzepte sind ein Mittel zur Erhöhung der Konsistenz.
    en: Concepts are a means to increase consistency.
    correct: true
  - de: Ein Konzept kann Einschränkungen für die Umsetzung vieler Bausteine definieren.
    en: A concept can define constraints for the implementation of many building blocks.
    correct: true
  - de: Ein Konzept kann durch einen einzigen Baustein umgesetzt werden.
    en: A concept might be implemented by a single building block.
    correct: true
- id: Q-17-13-02
  type: K
  points: 1
  text:
    de: Bei Ihrem Projekt arbeiten drei Architekt:innen und sieben Entwickler:innen an der Dokumentation der Softwarearchitektur. Welche Methoden eignen sich zur Gewährleistung einer konsistenten und zweckmäßigen Dokumentation und welche nicht?
    en: In your project, three architects and seven developers are working on the documentation of the software architecture. Which methods are appropriate in order to achieve a consistent and adequate documentation, and which are not?
  categories:
    de:
    - Geeignet
    - Nicht geeignet
    en:
    - Appropriate
    - Not appropriate
  rows:
  - de: Die/der leitende Architekt:in koordiniert die Erstellung der Dokumentation.
    en: The lead architect coordinates the creation of the documentation.
    answer: 0
  - de: Für die Dokumentation werden identische Vorlagen verwendet.
    en: Identical templates are used for the documentation.
    answer: 0
  - de: Alle Teile der Dokumentation werden automatisch aus dem Quellcode extrahiert.
    en: All parts of the documentation are automatically extracted from the source code.
    answer: 1
- id: Q-17-13-03
  type: P
  points: 2
  pick: 4
  text:
    de: Welche der folgenden Techniken sind am besten zur Darstellung von Abläufen oder Laufzeitverhalten geeignet?
    en: Which of the following techniques are best suited to illustrate the workflow or behavior of the system at runtime?
  options:
  - de: Flussdiagramme
    en: Flowcharts
    correct: true
  - de: Aktivitätsdiagramme
    en: Activity Diagrams
    correct: true
  - de: Darstellung von Screenflows (Abfolge von Benutzerinteraktionen)
    en: Depiction of screen flows (sequence of user interactions)
  - de: Sequenzdiagramm
    en: Sequence diagram
    correct: true
  - de: Lineares Venn-Diagramm
    en: Linear Venn diagram
  - de: Nummerierte Liste aufeinanderfolgender Schritte
    en: Numbered list of sequential steps
    correct: true
  - de: Tabellarische Schnittstellenbeschreibung
    en: Tabular description of interfaces
  - de: Klassendiagramme
    en: Class diagrams
- id: Q-17-13-04
  type: P
  points: 1
  pick: 3
  text:
    de: Welche der folgenden Grundsätze gelten für das Testen?
    en: Which of the following principles apply to testing?
  options:
  - de: Im Allgemeinen ist es nicht möglich, sämtliche Fehler eines Systems zu finden.
    en: In general, it is not possible to discover all errors in the system.
    correct: true
  - de: Bei Komponenten mit vielen bekannten vorherigen Fehlern sind die Chancen für zusätzliche Fehler hoch.
    en: In components with many known previous errors, the chances for additional errors are high.
    correct: true
  - de: Durch ausreichendes Testen kann aufgezeigt werden, dass ein Programm fehlerfrei ist.
    en: Sufficient testing can show that a program is free of errors.
  - de: Durch Testen kann nur die Existenz von Fehlern aufgezeigt werden, nicht jedoch ihre Abwesenheit.
    en: Testing shows the existence of errors rather than the absence of errors.
    correct: true
  - de: Die funktionale Programmierung erlaubt keine automatisierten Tests.
    en: Functional programming does not allow automated testing.
- id: Q-17-13-05
  type: K
  points: 2
  text:
    de: Welche der folgenden Aussagen zum Entwurfsprinzip „Information Hiding“ sind richtig und welche falsch?
    en: Which of the following statements regarding the information hiding principle are true and which are false?
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Durch die Befolgung des Prinzips „Information Hiding“ wird die Flexibilität für Änderungen erhöht.
    en: Adhering to the information hiding principle increases flexibility for modifications.
    answer: 0
  - de: Beim Information Hiding werden absichtlich Informationen vor Aufrufern oder Konsumenten des Bausteins verborgen.
    en: Information hiding involves deliberately hiding information from callers or consumers of the building block.
    answer: 0
  - de: Information Hiding erschwert das Bottom-Up Vorgehen.
    en: Information hiding makes it harder to work bottom-up.
    answer: 1
  - de: Information Hiding ist abgeleitet vom Ansatz der inkrementellen Verfeinerung entlang des Kontrollflusses.
    en: Information hiding is a derivative of the approach of incremental refinement along the control flow.
    answer: 1
- id: Q-20-04-03
  type: P
  points: 1
  pick: 2
  text:
    de: Was sind die wichtigsten Ziele von Softwarearchitektur?
    en: What are the most important goals of software architecture?
  options:
  - de: Verbesserung der Genauigkeit von Mustern in Struktur und Implementierung.
    en: Improve accuracy of patterns in structure and implementation.
  - de: Erreichung der Qualitätsanforderungen auf nachvollziehbare Weise.
    en: Achieve quality requirements in a comprehensible way.
    correct: true
  - de: Ermöglichung von kosteneffizienten Integrations- und Abnahmetests des Systems.
    en: Enable cost-effective integration and acceptance tests of the system.
  - de: Ermöglichung eines grundlegenden Verständnisses der Strukturen und Konzepte für das Entwicklungsteam und andere Beteiligte.
    en: Enable a basic understanding of structures and concepts for the development team and other stakeholders.
    correct: true
- id: Q-20-04-12
  type: K
  points: 1
  text:
    de: Stellen Sie sich vor, Sie sind Softwarearchitekt:in für eine große und verteilte Geschäftsanwendung im Banken- oder Versicherungsbereich. Welche der folgenden Aussagen sind für diese Situation richtig und welche falsch?
    en: Put yourself in the position of a software architect for a large, distributed business application in the banking or insurance domain. Which of the following statements is true and which is false?
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Die Architektur sollte so aufgebaut sein, dass häufig vorkommende Änderungen an den entsprechenden Geschäftsprozessen ohne umfangreiche Umstrukturierungen der Softwarearchitektur möglich sind.
    en: The architecture should be designed so that frequent changes to the related business processes are possible without extensive restructuring of the software architecture.
    answer: 0
  - de: Erforderliche Produktqualitäten sollten Ihre architektonischen Entscheidungen leiten.
    en: Required product qualities should drive your architectural decisions.
    answer: 0
  - de: Die Softwarearchitektur kann völlig unabhängig von Hardware und Infrastruktur entworfen werden.
    en: The software architecture can be designed completely independent of the hardware and infrastructure.
    answer: 1
- id: Q-20-04-04
  type: P
  points: 1
  pick: 3
  text:
    de: Was sind Ihre wichtigsten Verantwortlichkeiten als Softwarearchitekt:in in Bezug auf Anforderungen?
    en: What are your most important responsibilities as a software architect with respect to requirements?
  options:
  - de: Unterstützung der Fachexpert:innen dabei, Qualitätsanforderungen konkret und explizit zu formulieren.
    en: Support the business people to specify explicit and concrete quality requirements.
    correct: true
  - de: Hilfe bei der Identifizierung von neuen Geschäftsmöglichkeiten anhand Ihres technischen Know-hows.
    en: Help to identify new business opportunities based on your technology know-how.
    correct: true
  - de: Ablehnung von Anforderungen, die technische Risiken enthalten.
    en: Reject business requirements that contain technical risks.
  - de: Umformulierung aller Geschäftsanforderungen, so dass sie für Ihr Entwicklungsteam verständlich sind.
    en: Capture all business requirements in a terminology that can be understood by your development team.
  - de: Überprüfung der Anforderungen auf technische Machbarkeit.
    en: Check requirements for technological feasibility.
    correct: true
- id: Q-20-04-07
  type: P
  points: 1
  pick: 3
  text:
    de: Sie sind als Architekt:in dafür zuständig, ein Altsystem entsprechend den laufenden Betriebsanforderungen am Laufen zu halten. Was sind Ihre wichtigsten Aufgaben?
    en: You are responsible as an architect for keeping a legacy system up and running according to the ongoing requirements of your business. What are the most important action items on your agenda?
  options:
  - de: Verhandlung des Wartungsbudgets für Ihr Team
    en: Negotiating the maintenance budget for your team
  - de: Sicherstellung einer aktuellen Dokumentation des ausgelieferten Systems
    en: Assuring up-to-date documentation of the deployed system
    correct: true
  - de: Analyse der Auswirkungen von neuen Anforderungen auf das aktuelle System
    en: Analyzing the impact of new requirements on the current system
    correct: true
  - de: Ermunterung der Teammitglieder, neue Programmiersprachen zu lernen
    en: Encouraging the team members to learn new programming languages
  - de: Ihren Vorgesetzten technologische Updates zusätzlich zu den Geschäftsanforderungen vorschlagen
    en: Suggesting technology updates in addition to the business requirements to your management
    correct: true
- id: Q-21-05-01
  type: K
  points: 2
  text:
    de: Welche der folgenden Aussagen zu Architekturentscheidungen sind wahr, welche falsch?
    en: Which of the following statements regarding architecture decisions are true, which are false?
  categories:
    de:
    - Wahr
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Architekturentscheidungen müssen nie aufgeschrieben werden, da diese bereits dem Entwicklungsteam bekannt sind.
    en: Architecture decisions never need to be written down because they are already known to the development team.
    answer: 1
  - de: Architecture Decision Records helfen dabei, Entscheidungen in ihrem Kontext nachzuvollziehen.
    en: An architecture decision record helps to make the decision’s context understood.
    answer: 0
  - de: Nachdem man sich für ein zentrales Framework (z.B. Persistenzframework) entschieden hat, darf diese Entscheidung nicht mehr geändert werden.
    en: Once a decision has been made on a central or fundamental framework (e.g. persistence framework), that decision must not be changed.
    answer: 1
  - de: Qualitätsanforderungen helfen maßgeblich bei Architekturentscheidungen.
    en: Quality requirements help significantly with architecture decisions.
    answer: 0
- id: Q-20-04-09
  type: K
  points: 2
  text:
    de: Geben Sie für jede der folgenden Aussagen an, ob sie richtig oder falsch ist.
    en: Decide for each of the following statements whether it is true or false.
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Jede Iteration eines agilen Entwicklungsvorgehens kann Auswirkungen auf architektonische Grundsatzentscheidungen haben.
    en: Each iteration of an agile development approach could have an impact on the fundamental architecture decisions.
    answer: 0
  - de: Der Gesamtaufwand für Architekturarbeit ist bei iterativen Projekten wesentlich höher als bei Wasserfall-Projekten.
    en: The total effort spent on architectural work is much higher in iterative projects compared to waterfall projects.
    answer: 1
  - de: Agile Projekte benötigen keine Architekturdokumente, da das Entwicklungsteam in täglichen Standup-Meetings Entscheidungen kommuniziert.
    en: Agile projects do not need architecture documents since the development team uses daily standup-meetings to communicate decisions.
    answer: 1
  - de: Wenn Ihr System aus einer Reihe von Microservices besteht, ist kein zentrales Architekturdokument erforderlich, da jeder Service seine Technologien auswählen kann.
    en: If your systems consist of a set of microservices there is no need for a central architecture document since each service is free to choose its technologies.
    answer: 1
- id: Q-20-04-10
  type: K
  points: 2
  text:
    de: Geben Sie an, welche der folgenden Aussagen zu Projektzielen und Architekturzielen richtig und welche falsch sind.
    en: Which of the following statements regarding project goals and architectural goals is true and which is false.
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Projektziele können funktionale Anforderungen sowie Qualitätsanforderungen umfassen.
    en: Project Goals can include functional requirements as well as quality requirements.
    answer: 0
  - de: Architekturziele leiten sich von den Qualitätsanforderungen für das System oder Produkt ab.
    en: Architectural goals are derived from the quality requirements for the system or product.
    answer: 0
  - de: Stakeholder aus dem Business sollten sich auf Geschäftsziele konzentrieren und sich nicht mit Architekturzielen auseinandersetzen.
    en: Business stakeholders should concentrate on business goals and not interfere with architectural goals.
    answer: 1
  - de: Zur Vermeidung von Konflikten sollten Geschäfts- und Architekturziele einander nicht überlappen.
    en: To avoid conflicts, business goals and architectural goals should be non-overlapping sets.
    answer: 1
- id: Q-20-04-11
  type: P
  points: 1
  pick: 2
  text:
    de: Was bedeutet die Regel „explizit, nicht implizit“ für die Architekturarbeit? Wählen Sie die passendsten Antworten aus.
    en: What does the rule “explicit, not implicit” mean for architecture work? Choose the best-fitting answers.
  options:
  - de: Architekt:innen sollten rekursive Strukturen vermeiden und durch explizite Schleifen ersetzen.
    en: Architects should avoid recursive structures and replace them by explicit loops.
  - de: Architekt:innen sollten die Annahmen, die zu Entscheidungen führen, explizit machen.
    en: Architects should make the assumptions leading to decisions explicit.
    correct: true
  - de: Architekt:innen sollten explizit auf Erläuterungen (d.h. Kommentare) in natürlicher Sprache für jeden Baustein bestehen.
    en: Architects should explicitly insist on natural language explanations (i.e. comments) for each building block.
  - de: Architekt:innen sollten explizit auf schriftlichen oder zumindest mündlichen Begründungen für Aufwandschätzungen der Entwicklung von ihrem Team bestehen.
    en: Architects should explicitly insist on written or at least verbal justifications for development effort estimates from their team.
  - de: Architekt:innen sollten die Voraussetzungen für ihre Entscheidungen explizit darlegen.
    en: Architects should make prerequisites for their decisions explicit.
    correct: true
