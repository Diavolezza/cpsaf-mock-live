    en: Configuration view
  - de: Laufzeitsicht
    en: Runtime view
    correct: true
- id: Q-20-04-22
  type: P
  points: 1
  pick: 2
  text:
    de: Sie dokumentieren einen Baustein einer Softwarearchitektur. Welche Informationen sollten in seiner Black-Box-Beschreibung enthalten sein?
    en: When documenting a building block of your software architecture, what information should the black-box description contain?
  options:
  - de: Öffentliche Schnittstellen.
    en: Public interfaces.
    correct: true
  - de: Verantwortlichkeiten des Bausteins.
    en: Responsibility of the building block.
    correct: true
  - de: Interne Struktur des Bausteins.
    en: Internal structure of the building block.
  - de: Spezifikation von Implementierungsdetails.
    en: Specification of the implementation details.
- id: Q-20-04-17
  type: P
  points: 1
  pick: 2
  text:
    de: Welche Voraussetzungen müssen vor der Entwicklung einer Softwarearchitektur erfüllt sein? Wählen Sie die passendsten Antworten aus.
    en: Which prerequisites have to be fulfilled before developing a software architecture? Pick the most appropriate answers.
  options:
  - de: Die Anforderungsspezifikation für das System ist vollständig, detailliert und konsistent.
    en: The requirements specification for the system is complete, detailed and consistent.
  - de: Die wichtigsten Qualitätsanforderungen an das System sind bekannt.
    en: The most important qualities for the system are known.
    correct: true
  - de: Die organisatorischen Randbedingungen sind bekannt.
    en: Organizational constraints are known.
    correct: true
  - de: Die Programmiersprache wurde ausgewählt.
    en: The programming language has been selected.
  - de: Die Hardware für das Entwicklungsteam ist verfügbar.
    en: Hardware for the development team is available.
- id: Q-20-04-18
  type: P
  points: 1
  pick: 3
  text:
    de: Welche Faktoren können den Entwurf einer Softwarearchitektur beeinflussen? Wählen Sie die passendsten Antworten aus.
    en: Which factors can influence the design of a software architecture? Pick the most appropriate answers.
  options:
  - de: Politische.
    en: Political.
    correct: true
  - de: Organisatorische.
    en: Organizational.
    correct: true
  - de: Technische.
    en: Technical.
    correct: true
  - de: Virtuelle.
    en: Virtual.
- id: Q-20-04-19
  type: A
  points: 1
  text:
    de: Welche der folgenden Eigenschaften lässt sich am ehesten durch eine Schichtenarchitektur verbessern?
    en: Which of the following qualities can most likely be improved by using a layered architecture?
  options:
  - de: Laufzeiteffizienz (Performance).
    en: Runtime efficiency (performance).
  - de: Flexibilität bei der Modifizierung oder Änderung des Systems.
    en: Flexibility in modifying or changing the system.
    correct: true
  - de: Flexibilität bei der Laufzeit (Konfigurierbarkeit).
    en: Flexibility at runtime (configurability).
  - de: Nichtabstreitbarkeit.
    en: Non-repudiability.
- id: Q-20-04-33
  type: P
  points: 1
  pick: 2
  text:
    de: Für welche Entwurfsprobleme bietet das Pipes & Filter Pattern Lösungsansätze?
    en: Which type of problems provide a good fit for the Pipes & Filter Pattern?
  options:
  - de: Verwaltung von globalem Anwendungszustand
    en: Management of global application state
  - de: Strukturierung von IT-Systemen die Datenströme verarbeiten
    en: IT systems which process data streams
    correct: true
  - de: Entkopplung von Verarbeitungsschritten
    en: Decoupling multiple steps of an execution
    correct: true
  - de: Entkopplung von zeitlichen Abhängigkeiten
    en: Temporal decoupling of an application
- id: Q-20-04-20
  type: A
  points: 1
  text:
    de: Welche Ziele versuchen Sie mit dem Dependency-Inversion-Prinzip zu erreichen?
    en: Which goals are you trying to achieve with the dependency inversion principle?
  options:
  - de: Große Bausteine sollen nicht von kleinen Bausteinen abhängen.
    en: Big building blocks shall not depend on small building blocks.
  - de: Komponenten sollen in der Lage sein, abhängige Komponenten leichter zu erstellen.
    en: Components shall be able to create dependent components more easily.
  - de: Bausteine sollen nur über Abstraktionen voneinander abhängen.
    en: Building blocks shall only depend on each other via abstractions.
    correct: true
- id: Q-20-04-21
  type: K
  points: 2
  text:
    de: Was sind die Eigenschaften von enger (hoher) bzw. loser (niedriger) Kopplung?
    en: What are characteristics of tight (high) or loose (low) coupling?
  categories:
    de:
    - Enge Kopplung
    - Lose Kopplung
    en:
    - Tight coupling
    - Loose coupling
  rows:
  - de: Bausteine können abhängige Bausteine direkt, d.h. ohne Umwege über Schnittstellen oder Abstraktionen, aufrufen.
    en: Building blocks directly call dependent building blocks, i.e., without using indirect calls via interfaces or abstractions.
    answer: 0
  - de: Bausteine verwenden gemeinsame komplexe Datenstrukturen.
    en: Building blocks use shared complex data structures.
    answer: 0
  - de: Bausteine verwenden eine gemeinsame Tabelle (für Schreib- und Leseoperationen) innerhalb einer relationalen Datenbank.
    en: Building blocks use a shared table (for read- and write operations) within a relational database.
    answer: 0
  - de: Beim Baustein-Design haben Sie das Dependency-Inversion-Prinzip konsequent umgesetzt.
    en: When designing building blocks, you have consistently applied the dependency inversion principle.
    answer: 1
- id: Q-20-04-14
  type: P
  points: 1
  pick: 2
  text:
    de: 'Welche Aussagen zum „Don’t repeat yourself“-Prinzip (DRY) treffen am ehesten zu? Anders gesagt: Was könnte passieren, wenn Teile des Quellcodes oder der Konfiguration im System mehrfach vorhanden sind?'
    en: 'Which statements about the principle “Don’t repeat yourself” (DRY) fit best? In other words: What could happen, if parts of the source code or configuration do exist in multiple copies in the system?'
  options:
  - de: DRY verringert die Sicherheit.
    en: DRY reduces security.
  - de: Die strenge Einhaltung von DRY könnte zu höherer Kopplung führen.
    en: Strict adherence to DRY could lead to higher coupling.
    correct: true
  - de: Die Komponenten des Systems mit redundantem Code können unabhängig voneinander verbessert werden.
    en: The components of the system that contain redundant code can be improved independently of each other.
    correct: true
  - de: Die Einhaltung von DRY führt zu einer Verringerung der Angriffsvektoren in der IT-Sicherheit.
    en: Adherence to DRY leads to fewer attack vectors in IT security.
  - de: Die Anwendung der Schichtenmuster ermöglicht eine konsistente Anwendung des DRY-Prinzips.
    en: Applying the Layer patterns allows a consistent application of the DRY principle.
- id: Q-20-04-15
  type: K
  points: 2
  text:
    de: Sie können Aspekte Ihrer Softwarearchitektur mündlich und/oder schriftlich kommunizieren. In welchem Zusammenhang stehen diese Möglichkeiten zueinander? Geben Sie für jede der folgenden Aussagen an, ob sie richtig oder falsch ist.
    en: You can communicate aspects of your software architecture verbally and/or in writing. How do these variants correlate? Decide for each of the following statements whether it is true or false.
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Mündliche Kommunikation sollte schriftliche Dokumentation ergänzen.
    en: Verbal communication should supplement written documentation.
    answer: 0
  - de: Feedback zu Architekturentscheidungen sollte zur Sicherstellung der Nachverfolgbarkeit grundsätzlich schriftlich erfolgen.
    en: Feedback to architecture decisions should always be done in writing to ensure traceability.
    answer: 1
  - de: Schriftliche Dokumentation sollte immer mündlicher Kommunikation vorausgehen.
    en: Written documentation should always precede verbal communication.
    answer: 1
  - de: Architekt:innen sollten sich eine Variante (mündlich oder schriftlich) aussuchen und während der gesamten Entwicklung dabei bleiben.
    en: Architects should pick one variant (verbal or written) and stick to this choice during the whole development.
    answer: 1
- id: Q-20-04-37
  type: K
  points: 2
  text:
    de: Welche der folgenden Aussagen zu Notationen für Architektursichten sind richtig und welche falsch?
    en: Which of the following statements about notations for architectural views is true and which is false?
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Business Process Model & Notation (BPMN) sollte nur von Business-Analysten und nicht zur Architekturdokumentation verwendet werden.
    en: Business Process Model & Notation (BPMN) should only be used by Business Analysts and not for architecture documentation.
    answer: 1
  - de: UML-Verteilungsdiagramme sind die einzige Möglichkeit zur Dokumentation des Mappings der Softwarekomponenten in Bezug auf die Infrastruktur.
    en: UML deployment models are the only way to document the mapping of software components to infrastructure.
    answer: 1
  - de: UML-Paketdiagramme können zum Festhalten der Bausteinsicht der Softwarearchitektur verwendet werden.
    en: UML Package Diagrams can be used to capture the building-block view of software architectures.
    answer: 0
  - de: Solange die Notation (z. B. mithilfe einer Legende) erläutert wird, kann eine beliebige Notation ausreichen, um Bausteinstrukturen und Zusammenarbeit zu beschreiben.
    en: As long as the notation is explained (e.g. by a legend), any notation can be sufficient to describe building block structures and collaboration.
    answer: 0
- id: Q-20-04-13
  type: P
  points: 1
  pick: 2
  text:
    de: Welche Architektursichten haben die beste praktische Anwendung für die Entwicklung von Softwarearchitekturen?
    en: Which architectural views have the most practical application for developing software architectures?
  options:
  - de: Pattern-Sicht.
    en: Pattern View.
  - de: Beobachtersicht (Observer-View).
    en: Observer View.
  - de: Bausteinsicht (Komponentensicht).
    en: Building-Block View (Component View).
    correct: true
  - de: Verteilungssicht.
    en: Deployment View.
    correct: true
- id: Q-20-04-23
  type: P
  points: 1
  pick: 2
  text:
    de: In der Kontextsicht können Sie einen geschäftlichen Kontext („business context“) und einen technischen Kontext verwenden. Wählen Sie die am besten passenden Antworten für den technischen Kontext aus.
    en: The context view might contain a business context and a technical context, or both. Pick the most appropriate answers that apply to the technical context.
  options:
  - de: Der technische Kontext enthält die physischen Übertragungskanäle zwischen Ihrem System und der Umgebung.
    en: The technical context contains the physical channels between your system and its environment.
    correct: true
  - de: Der technische Kontext enthält die gesamte Infrastruktur, über die die Komponenten Ihres Systems verteilt werden.
    en: The technical context contains all the infrastructure on which the components of your system are deployed.
  - de: Der technische Kontext sollte die Hardware-Preisliste oder die Preisgestaltung von Cloud-Diensten, die als Infrastruktur für Ihre Architektur verwendet werden, enthalten.
    en: The technical context should include hardware pricing or pricing of cloud services used as infrastructure for your architecture.
  - de: Der technische Kontext enthält Informationen zur gewählten Programmiersprache sowie allen zur Implementierung Ihrer Softwarearchitektur verwendeten Frameworks.
    en: The technical context contains information about the chosen programming language as well as all frameworks used to implement your software architecture.
  - de: Der technische Kontext enthält gegebenenfalls andere Elemente als der Geschäftskontext („business context“).
    en: The technical context might contain different elements than the business context.
    correct: true
- id: Q-20-04-24
  type: P
  points: 1
  pick: 2
  text:
    de: Die Dokumentation der Softwarearchitektur sollte Beschreibungen der Querschnittskonzepte enthalten. Wählen Sie die besten Gründe, warum die Dokumentation von Querschnittskonzepten sinnvoll ist.
    en: Software architecture documentation could contain descriptions of cross-cutting concerns. Pick the best reasons why documentation of cross-cutting concerns is useful.
  options:
  - de: Querschnittskonzepte sollten sich auf die Fachdomäne konzentrieren und frei von technischen Informationen sein.
    en: Cross-cutting concepts should focus on the domain and be free of technical information.
  - de: Aspekte oder Konzepte, die in mehreren Teilen Ihrer Softwarearchitektur verwendet werden, sollten auf nicht redundante Weise beschrieben werden.
    en: Aspects or concepts that are used in multiple parts of your software architecture should be described in a non-redundant way.
    correct: true
  - de: Querschnittskonzepte können in weiteren Produkten innerhalb der gleichen Organisation erneut verwendet werden.
    en: Cross-cutting concepts can be reused in more products within the same organization.
    correct: true
  - de: Querschnittskonzepte sollten von Spezialist:innen implementiert werden. Daher ist eine separate Dokumentation hilfreich.
    en: Cross-cutting concepts should be implemented by specialists. Therefore, separate documentation is useful.
- id: Q-20-04-25
  type: K
  points: 2
  text:
    de: Was sind Richtlinien für ein gutes Schnittstellen-Design? Kreuzen Sie an, welche der folgenden Aussagen richtig und welche falsch sind.
    en: What are guidelines for good interface design? Check which of the following statements are true and which are false.
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Die Verwendung der Schnittstellen sollte einfach zu erlernen sein.
    en: Use of interfaces should be easy to learn.
    answer: 0
  - de: Es soll möglich sein, angemessen verständlichen Client-Code für diese Schnittstelle zu schreiben.
    en: It should be possible to write client code for the interface, that is reasonably easy to understand.
    answer: 0
  - de: Eine Schnittstelle soll Zugriff auf eine umfassende Menge von Implementierungsdetails ermöglichen.
    en: An interface should provide access to a comprehensive set of implementation details.
    answer: 1
  - de: Schnittstellenspezifikationen sollten funktionale und nichtfunktionale Aspekte enthalten.
    en: Interface specifications should contain functional and non-functional aspects.
    answer: 0
  - de: Lokale und entfernte („remote“) Aufrufe einer Schnittstelle sollen sich in allen Belangen identisch verhalten.
    en: Local and remote calls to an interface should behave identically in all aspects.
    answer: 1
- id: Q-20-04-26
  type: K
  points: 2
  text:
    de: 'Eine Definition lautet: „Softwarearchitektur ist die Summe aller während der Entwicklung gefällten Entscheidungen“. Kreuzen Sie an, welche der folgenden Aussagen zu Architektur- /Designentscheidungen richtig und welche falsch sind.'
    en: 'One definition says: “Software architecture is the sum of all the decisions you have taken during development.” Check which of the following statements about architectural/design decisions are true and which are false.'
  categories:
    de:
    - Richtig
    - Falsch
    en:
    - 'True'
    - 'False'
  rows:
  - de: Architektonische Entscheidungen können sich in der Struktur der Bausteine oder Komponenten niederschlagen.
    en: Architectural decisions can impact the structure of the building block or components.
    answer: 0
  - de: Softwarearchitekt:innen sollten alle Entwurfsentscheidungen schriftlich begründen.
    en: Software architects shall justify all design decisions in writing.
    answer: 1
  - de: Architektonische Entscheidungen können untereinander Wechselwirkungen haben.
    en: Architectural decisions can have interdependencies between each other.
    answer: 0
  - de: Kompromisse zwischen zueinander in Konflikt stehenden Qualitätsanforderungen sollten explizite Entscheidungen sein.
    en: Tradeoffs between conflicting quality requirements should be explicit decisions.
    answer: 0
- id: Q-20-04-31
  type: K
  points: 2
  text:
    de: Welche der folgenden Aussagen sind typische Gründe zur Einführung einer Architekturdokumentation und welche nicht?
    en: Which of the following statements are typical reasons for introducing an architecture documentation and which are not typical reasons?
  categories:
    de:
    - Typisch
    - Nicht typisch
    en:
    - Typical
    - Not typical
  rows:
  - de: Unterstützung des Onboardings neuer Entwickler:innen.
    en: To support onboarding of new developers.
    answer: 0
  - de: Unterstützung der Testautomatisierung des Systems.
    en: To support the automated testing approach of the system.
    answer: 1
  - de: Unterstützung der Arbeit von verteilten Teams.
    en: To support the work of distributed teams.
    answer: 0
  - de: Unterstützung von späteren Verbesserungen des Systems.
    en: To assist in future enhancements of the product.
    answer: 0
  - de: Einhaltung regulatorischer Vorgaben.
    en: To conform to regulatory or legal constraints.
    answer: 0
  - de: Sicherstellung der gleichmäßigen Auslastung des Teams.
    en: To ensure that developers have enough work to do.
    answer: 1
- id: Q-20-04-30
  type: K
  points: 2
  text:
    de: Welche der folgenden Eigenschaftspaare stehen üblicherweise miteinander in Konflikt und welche nicht?
    en: Which of the following pairs of qualities are usually in conflict to each other, and which are not?
  categories:
    de:
    - Konflikt
    - Kein Konflikt
    en:
    - Conflict
    - No conflict
  rows:
  - de: Verständlichkeit – Lesbarkeit
    en: Understandability – Readability
    answer: 1
  - de: Benutzerfreundlichkeit – Sicherheit
    en: Usability – Security
    answer: 0
  - de: Laufzeitkonfigurierbarkeit – Robustheit
    en: Runtime configurability – Robustness
    answer: 0
  - de: Sicherheit – Funktionale Korrektheit
    en: Security – Functional correctness
    answer: 1
- id: Q-20-04-27
  type: A
  points: 1
  text:
    de: ISO 25010 enthält allgemeine Qualitätseigenschaften für Softwaresysteme. Wie können Qualitätsanforderungen zu diesen Eigenschaften konkretisiert werden?
    en: ISO 25010 provides generic quality characteristics for software systems. How can quality requirements concerning these characteristics be made more concrete?
  options:
  - de: Durch Entwickeln von UI-Prototypen.
    en: By developing UI prototypes.
  - de: Durch Definieren expliziter Schnittstellen.
    en: By defining explicit interfaces.
  - de: Durch Erstellen, Verfassen oder Diskutieren von Qualitätsszenarien.
    en: By discussing or writing quality scenarios.
    correct: true
  - de: Durch Erstellen automatisierter Tests.
    en: By creating automated tests.
- id: Q-20-04-28
  type: P
  points: 2
  pick: 4
  text:
    de: Welche der folgenden Punkte sind am besten geeignet, die qualitative Bewertung einer Softwarearchitektur bzgl. der Erfüllung von Qualitätsanforderungen zu unterstützen?
    en: Which of the following points are best suited to support the qualitative evaluation of a software architecture with regard to the fulfillment of quality requirements?
  options:
  - de: Quantitative Abhängigkeitsanalyse.
    en: Quantitative dependency analysis.
    correct: true
  - de: Architekturmodelle.
    en: Architecture models.
    correct: true
  - de: Qualitätsszenarien.
    en: Quality scenarios.
    correct: true
  - de: Teamgröße.
    en: Team size.
  - de: Logdateien.
    en: Log files.
    correct: true
  - de: Organigramm.
    en: Organizational structure.
- id: Q-20-04-29
  type: P
  points: 1
  pick: 2
  text:
    de: Sie versuchen, Ihre Architektur qualitativ zu analysieren. Was sind die zutreffendsten Anzeichen für architektonische Problembereiche?
    en: You try to analyze your architecture qualitatively. Which are the most appropriate indicators for architectural problem areas?
  options:
  - de: Hohe Kopplung der Komponenten.
    en: High coupling of components.
    correct: true
  - de: Namen öffentlicher Methoden geben nicht deren Zweck wieder.
    en: Names of public methods do not reflect their purpose.
  - de: Fehlende Kommentare.
    en: Missing comments.
  - de: Häufung von Fehlern in bestimmten Bausteinen des Systems.
    en: Clusters of errors in certain building blocks of the system.
    correct: true
  - de: Anzahl der Testfälle pro Komponente.
    en: Number of test cases per component.
- id: Q-20-04-36
  type: P
  points: 1
  pick: 3
  text:
    de: Sie versuchen, ihre Architektur quantitativ zu untersuchen. Welche der folgenden Größen können Sie für Ihre Softwarearchitektur zuverlässig messen? Wählen Sie die am besten passenden Antworten aus.
    en: You try to quantitatively analyze your architecture. Which three of the following properties can you measure reliably in your software architecture? Pick the best fitting answers.
  options:
  - de: Größe der Bausteine (z. B. Lines-of-Code).
    en: Size of building blocks (e.g. LOC).
    correct: true
  - de: Änderungsrate des Quellcodes der Komponenten.
    en: Change rate of the source code of components.
    correct: true
  - de: Kohäsion der Architekturkomponenten.
    en: Cohesion of the architectural components.
  - de: Sicherheitsstufe einer Komponente.
    en: Security level of a component.
  - de: Anzahl der Personen, die zu einer bestimmten Komponente beigetragen haben.
    en: Number of the developers that contributed to a specific component.
    correct: true
