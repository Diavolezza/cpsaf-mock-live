  - de: Domain-driven Design
    en: Domain driven design
    correct: true
  - de: Sichtenbasierte Architekturentwicklung
    en: View based architecture development
    correct: true
  - de: Bottom-up Design
    en: Bottom-up design
    correct: true
  - de: Mehrheitsentscheid
    en: Majority voting
