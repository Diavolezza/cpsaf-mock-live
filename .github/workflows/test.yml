name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Scoring and question catalogues
        run: npm test
      - name: Security rules (Firebase emulator)
        run: npm run test:rules
      - name: Install Chromium for the end-to-end test
        run: npx playwright install --with-deps chromium
      - name: End-to-end test with Firebase emulators
        run: npm run test:e2e
